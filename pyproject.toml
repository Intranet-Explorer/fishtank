[project]
name = "fishtank"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
description = "A live fishtank for local LLM agents sharing a habitat — not a task queue, not a benchmark."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.scripts]
worldd = "world.server:main"
fishtank-proxy = "proxy.fetch_proxy:main"
fishtank-seed = "world.seed:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["world*", "agent*", "proxy*"]
